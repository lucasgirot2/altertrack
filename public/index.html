<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlterTrack — Recherche alternance</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f4f1;
      --surface: #ffffff;
      --surface2: #f0efe9;
      --border: rgba(0,0,0,0.08);
      --border-md: rgba(0,0,0,0.14);
      --text: #1a1a18;
      --text2: #6b6a65;
      --text3: #9b9a96;
      --blue: #185FA5;
      --blue-bg: #E6F1FB;
      --blue-text: #185FA5;
      --green: #1D9E75;
      --green-bg: #E1F5EE;
      --green-text: #0F6E56;
      --amber-bg: #FAEEDA;
      --amber-text: #854F0B;
      --red-bg: #FCEBEB;
      --red-text: #A32D2D;
      --radius: 10px;
      --radius-sm: 6px;
    }

    body {
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px;
      min-width: 220px;
      background: var(--surface);
      border-right: 0.5px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1.25rem 0;
    }

    .logo { padding: 0 1.25rem 1.25rem; border-bottom: 0.5px solid var(--border); margin-bottom: 1rem; }
    .logo-title { font-size: 16px; font-weight: 600; color: var(--text); }
    .logo-sub { font-size: 11px; color: var(--text3); margin-top: 3px; }

    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 1.25rem; font-size: 13px; color: var(--text2);
      cursor: pointer; transition: background 0.12s;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: var(--surface2); color: var(--text); font-weight: 500; border-left: 2px solid var(--blue); }

    .nav-badge {
      margin-left: auto; background: var(--blue-bg); color: var(--blue-text);
      font-size: 11px; padding: 1px 7px; border-radius: 10px; font-weight: 500;
    }

    .sidebar-stats {
      margin-top: auto; padding: 1rem 1.25rem 0;
      border-top: 0.5px solid var(--border); display: flex; flex-direction: column; gap: 8px;
    }
    .stat-row { display: flex; justify-content: space-between; font-size: 12px; }
    .stat-label { color: var(--text3); }
    .stat-val { font-weight: 500; }

    /* ── Main ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .topbar {
      background: var(--surface); border-bottom: 0.5px solid var(--border);
      padding: 0.875rem 1.5rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }

    .search-wrap { flex: 1; min-width: 180px; position: relative; }
    .search-wrap input {
      width: 100%; padding: 8px 12px 8px 34px; font-size: 13px;
      border: 0.5px solid var(--border-md); border-radius: var(--radius-sm);
      background: var(--surface2); color: var(--text); outline: none;
    }
    .search-wrap input:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(24,95,165,0.12); }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 14px; }

    .control-group { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
    .control-group select, .control-group input[type="number"] {
      font-size: 12px; padding: 7px 10px;
      border: 0.5px solid var(--border-md); border-radius: var(--radius-sm);
      background: var(--surface2); color: var(--text); cursor: pointer;
    }

    .btn { padding: 7px 14px; font-size: 12px; border-radius: var(--radius-sm); cursor: pointer; transition: opacity 0.15s; white-space: nowrap; }
    .btn-outline { border: 0.5px solid var(--border-md); background: var(--surface); color: var(--text2); }
    .btn-outline:hover { background: var(--surface2); color: var(--text); }
    .btn-primary { border: none; background: var(--blue); color: #fff; font-weight: 500; }
    .btn-primary:hover { opacity: 0.87; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Content ── */
    .content { flex: 1; overflow-y: auto; padding: 1.25rem 1.5rem; }

    .panel { display: none; }
    .panel.active { display: block; }

    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .section-title { font-size: 14px; font-weight: 500; }
    .section-sub { font-size: 12px; color: var(--text2); }

    /* ── Offer cards ── */
    .offers-grid { display: flex; flex-direction: column; gap: 8px; }

    .offer-card {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius); padding: 1rem 1.25rem; transition: border-color 0.15s;
    }
    .offer-card:hover { border-color: var(--border-md); }
    .offer-card.applied { border-left: 3px solid var(--green); }
    .offer-card.ignored { display: none; }

    .offer-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
    .company-logo {
      width: 38px; height: 38px; border-radius: 8px; background: var(--surface2);
      border: 0.5px solid var(--border); display: flex; align-items: center;
      justify-content: center; font-size: 13px; font-weight: 500; color: var(--text2); flex-shrink: 0;
    }
    .offer-meta { flex: 1; min-width: 0; }
    .offer-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .offer-company { font-size: 12px; color: var(--text2); }

    .offer-badges { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; white-space: nowrap; }
    .badge-source { background: var(--surface2); color: var(--text3); border: 0.5px solid var(--border); }
    .badge-lba { background: var(--blue-bg); color: var(--blue-text); }
    .badge-remote { background: var(--green-bg); color: var(--green-text); }
    .badge-applied { background: var(--green-bg); color: var(--green-text); }

    .offer-desc {
      font-size: 12px; color: var(--text2); line-height: 1.55; margin-bottom: 10px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .offer-footer { display: flex; align-items: center; justify-content: space-between; }
    .offer-date { font-size: 11px; color: var(--text3); }
    .offer-actions { display: flex; gap: 6px; }

    .btn-apply {
      padding: 5px 14px; font-size: 12px; font-weight: 500; border-radius: var(--radius-sm);
      background: var(--blue); color: #fff; border: none; cursor: pointer; transition: opacity 0.15s;
    }
    .btn-apply:hover { opacity: 0.85; }
    .btn-apply.done { background: var(--green); cursor: default; }
    .btn-ignore {
      padding: 5px 10px; font-size: 12px; border-radius: var(--radius-sm);
      background: transparent; color: var(--text3); border: 0.5px solid var(--border); cursor: pointer;
    }
    .btn-ignore:hover { background: var(--surface2); color: var(--text2); }

    /* ── Loader / States ── */
    .loader { text-align: center; padding: 3.5rem 1rem; color: var(--text2); font-size: 13px; }
    .loader-ring {
      width: 28px; height: 28px; border: 2.5px solid var(--border-md);
      border-top-color: var(--blue); border-radius: 50%;
      animation: spin 0.75s linear infinite; margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text2); font-size: 13px; line-height: 1.6; }
    .error-box { background: var(--red-bg); border: 0.5px solid #F7C1C1; border-radius: var(--radius-sm); padding: 12px 14px; font-size: 13px; color: var(--red-text); margin-bottom: 1rem; }

    /* ── Tracker table ── */
    .relance-alert {
      display: flex; align-items: center; gap: 8px; padding: 10px 14px;
      background: var(--amber-bg); border-radius: var(--radius-sm);
      font-size: 13px; color: var(--amber-text); margin-bottom: 8px;
    }
    .table-wrap { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); overflow: auto; }
    .tracker-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tracker-table th {
      text-align: left; padding: 9px 12px; font-size: 11px; font-weight: 500;
      color: var(--text2); border-bottom: 0.5px solid var(--border); white-space: nowrap;
    }
    .tracker-table td { padding: 10px 12px; border-bottom: 0.5px solid var(--border); vertical-align: middle; }
    .tracker-table tr:last-child td { border-bottom: none; }
    .tracker-table tr:hover td { background: var(--surface2); }
    .tracker-table select {
      font-size: 12px; padding: 4px 7px; border-radius: 6px;
      border: 0.5px solid var(--border-md); background: var(--surface2); color: var(--text); cursor: pointer;
    }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 20px; right: 20px; background: var(--surface);
      border: 0.5px solid var(--border-md); border-radius: var(--radius);
      padding: 11px 16px; font-size: 13px; color: var(--text);
      box-shadow: 0 4px 16px rgba(0,0,0,0.08); z-index: 999; display: none; max-width: 280px;
    }
    .toast.show { display: block; animation: fadeup 0.2s ease; }
    @keyframes fadeup { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

    .api-credit { font-size: 11px; color: var(--text3); margin-top: 10px; text-align: right; }
    .api-credit a { color: var(--blue-text); text-decoration: none; }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">
    <div class="logo-title">AlterTrack</div>
    <div class="logo-sub">Bezons · 95870 · alternance 2025</div>
  </div>
  <div class="nav-item active" onclick="showPanel('offers')">
    🔍 Offres
    <span class="nav-badge" id="badge-offers">—</span>
  </div>
  <div class="nav-item" onclick="showPanel('tracker')">
    📋 Suivi
    <span class="nav-badge" id="badge-tracker">0</span>
  </div>
  <div class="sidebar-stats">
    <div class="stat-row"><span class="stat-label">Postulé</span><span class="stat-val" id="stat-applied">0</span></div>
    <div class="stat-row"><span class="stat-label">À relancer</span><span class="stat-val" id="stat-relance">0</span></div>
    <div class="stat-row"><span class="stat-label">Entretiens</span><span class="stat-val" id="stat-entretien">0</span></div>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="search-wrap">
      <span class="search-icon">🔎</span>
      <input type="text" id="search-input" placeholder="Filtrer par titre, entreprise..." oninput="filterOffers()">
    </div>
    <div class="control-group">
      Rayon :
      <select id="radius-select" onchange="fetchOffers()">
        <option value="10">10 km</option>
        <option value="15">15 km</option>
        <option value="20" selected>20 km</option>
        <option value="30">30 km</option>
      </select>
    </div>
    <button class="btn btn-outline" id="refresh-btn" onclick="fetchOffers()">↻ Actualiser</button>
  </div>

  <div class="content">

    <!-- Panel Offres -->
    <div class="panel active" id="panel-offers">
      <div class="section-header">
        <span class="section-title">Offres d'alternance</span>
        <span class="section-sub" id="offers-sub">Chargement...</span>
      </div>
      <div id="offers-error"></div>
      <div class="offers-grid" id="offers-grid">
        <div class="loader"><div class="loader-ring"></div>Connexion à La Bonne Alternance...</div>
      </div>
      <div class="api-credit" id="api-credit"></div>
    </div>

    <!-- Panel Tracker -->
    <div class="panel" id="panel-tracker">
      <div id="relance-alerts"></div>
      <div class="section-header">
        <span class="section-title">Mes candidatures</span>
        <span class="section-sub" id="tracker-sub">0 candidature</span>
      </div>
      <div id="tracker-content">
        <div class="empty-state">Aucune candidature pour l'instant.<br>Postule à une offre pour la voir apparaître ici.</div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ── Configuration ──
  // En local : pointe vers /api/jobs (Vercel dev)
  // En production : pointe automatiquement vers ta fonction Vercel
  const API_BASE = window.location.hostname === 'localhost'
    ? 'http://localhost:3000/api/jobs'
    : '/api/jobs';

  const CENTER = { lat: 48.9224, lng: 2.2121 }; // Bezons 95870
  const ROME_CODES = ['M1705', 'M1706', 'M1803', 'M1402'];

  let allOffers = [];
  let applied = {};
  let ignored = new Set();
  let searchQ = '';

  // ── Navigation ──
  function showPanel(name) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
    document.querySelectorAll('.nav-item')[name === 'offers' ? 0 : 1].classList.add('active');
    if (name === 'tracker') renderTracker();
  }

  // ── Utilitaires ──
  function initials(name) {
    if (!name) return '?';
    return name.split(' ').slice(0, 2).map(w => w[0] || '').join('').toUpperCase().slice(0, 2) || '?';
  }

  function daysAgo(dateStr) {
    if (!dateStr) return '';
    const diff = Math.floor((Date.now() - new Date(dateStr)) / 86400000);
    if (diff === 0) return "Aujourd'hui";
    if (diff === 1) return "Hier";
    return `Il y a ${diff} j`;
  }

  // ── Fetch API (via proxy Vercel) ──
  async function fetchOffers() {
    const radius = document.getElementById('radius-select').value;
    const btn = document.getElementById('refresh-btn');
    btn.disabled = true;
    btn.textContent = 'Chargement...';

    document.getElementById('offers-grid').innerHTML = '<div class="loader"><div class="loader-ring"></div>Recherche des offres en cours...</div>';
    document.getElementById('offers-error').innerHTML = '';
    document.getElementById('offers-sub').textContent = 'Connexion...';

    try {
      const url = `${API_BASE}?latitude=${CENTER.lat}&longitude=${CENTER.lng}&radius=${radius}&romes=${ROME_CODES.join(',')}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Erreur ${res.status}`);
      const data = await res.json();

      let jobs = [];

      (data.jobs?.offres_emploi_lba || []).forEach(j => jobs.push({
        id: j.identifier?.id || crypto.randomUUID(),
        title: j.offer?.title || 'Poste en alternance',
        company: j.workplace?.name || j.workplace?.brand || 'Entreprise',
        location: j.workplace?.location?.address || '',
        desc: j.offer?.description || '',
        source: 'La Bonne Alternance',
        sourceBadge: 'lba',
        url: j.apply?.url || 'https://labonnealternance.apprentissage.beta.gouv.fr',
        date: j.publication?.creation,
        remote: j.contract?.remote,
      }));

      (data.jobs?.offres_emploi_partenaires || []).forEach(j => jobs.push({
        id: j.identifier?.id || crypto.randomUUID(),
        title: j.offer?.title || 'Poste en alternance',
        company: j.workplace?.name || j.workplace?.brand || 'Entreprise',
        location: j.workplace?.location?.address || '',
        desc: j.offer?.description || '',
        source: j.identifier?.partner_label || 'Partenaire',
        sourceBadge: 'partner',
        url: j.apply?.url || 'https://labonnealternance.apprentissage.beta.gouv.fr',
        date: j.publication?.creation,
        remote: j.contract?.remote,
      }));

      allOffers = jobs;
      document.getElementById('badge-offers').textContent = jobs.length;
      document.getElementById('api-credit').innerHTML = `Source : <a href="https://labonnealternance.apprentissage.beta.gouv.fr" target="_blank">La Bonne Alternance</a> (API officielle) · Actualisé le ${new Date().toLocaleTimeString('fr-FR')}`;
      renderOffers();

    } catch (err) {
      document.getElementById('offers-error').innerHTML = `<div class="error-box">⚠️ ${err.message} — Vérifie que ton backend Vercel est bien déployé.</div>`;
      document.getElementById('offers-grid').innerHTML = '<div class="empty-state">Lance <code>vercel dev</code> en local ou déploie sur Vercel pour voir les vraies offres.</div>';
      document.getElementById('offers-sub').textContent = 'Erreur de connexion';
    }

    btn.disabled = false;
    btn.textContent = '↻ Actualiser';
  }

  // ── Filtrage ──
  function filterOffers() {
    searchQ = document.getElementById('search-input').value.toLowerCase();
    renderOffers();
  }

  function getFiltered() {
    return allOffers.filter(o => {
      if (ignored.has(o.id)) return false;
      if (!searchQ) return true;
      return (o.title + ' ' + o.company).toLowerCase().includes(searchQ);
    });
  }

  // ── Rendu des offres ──
  function renderOffers() {
    const list = getFiltered();
    const radius = document.getElementById('radius-select').value;
    document.getElementById('offers-sub').textContent = `${list.length} offre${list.length !== 1 ? 's' : ''} · Bezons ±${radius} km`;

    if (list.length === 0) {
      document.getElementById('offers-grid').innerHTML = '<div class="empty-state">Aucune offre trouvée pour ces critères.</div>';
      return;
    }

    document.getElementById('offers-grid').innerHTML = list.map(o => {
      const isApplied = !!applied[o.id];
      const remoteLabel = o.remote === 'remote'
        ? '<span class="badge badge-remote">Full remote</span>'
        : o.remote === 'hybrid' ? '<span class="badge badge-remote">Hybride</span>' : '';
      const srcBadge = o.sourceBadge === 'lba'
        ? '<span class="badge badge-lba">La Bonne Alt.</span>'
        : `<span class="badge badge-source">${o.source}</span>`;

      return `<div class="offer-card${isApplied ? ' applied' : ''}" id="card-${o.id}">
        <div class="offer-top">
          <div class="company-logo">${initials(o.company)}</div>
          <div class="offer-meta">
            <div class="offer-title">${o.title}</div>
            <div class="offer-company">${o.company}${o.location ? ' · ' + o.location : ''}</div>
          </div>
        </div>
        <div class="offer-badges">
          ${srcBadge}${remoteLabel}
          ${isApplied ? '<span class="badge badge-applied">Postulé ✓</span>' : ''}
        </div>
        ${o.desc ? `<div class="offer-desc">${o.desc.slice(0, 240)}${o.desc.length > 240 ? '…' : ''}</div>` : ''}
        <div class="offer-footer">
          <span class="offer-date">${daysAgo(o.date)}</span>
          <div class="offer-actions">
            <button class="btn-ignore" onclick="ignoreOffer('${o.id}')">Ignorer</button>
            <button class="btn-apply${isApplied ? ' done' : ''}" onclick="applyOffer('${o.id}')">
              ${isApplied ? '✓ Postulé' : 'Postuler →'}
            </button>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  // ── Actions ──
  function applyOffer(id) {
    const o = allOffers.find(x => x.id === id);
    if (!o) return;
    if (!applied[id]) {
      applied[id] = {
        offer: o,
        date: new Date(),
        status: 'postule',
        relanceDate: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000)
      };
      updateStats();
      showToast('Enregistré ! Ouverture de l\'offre…');
      setTimeout(() => window.open(o.url, '_blank'), 400);
    } else {
      showToast('Déjà dans ton suivi.');
    }
    renderOffers();
  }

  function ignoreOffer(id) {
    ignored.add(id);
    renderOffers();
  }

  function updateStats() {
    const entries = Object.values(applied);
    document.getElementById('stat-applied').textContent = entries.length;
    document.getElementById('stat-relance').textContent = entries.filter(e => e.status === 'relance').length;
    document.getElementById('stat-entretien').textContent = entries.filter(e => e.status === 'entretien').length;
    document.getElementById('badge-tracker').textContent = entries.length;
  }

  // ── Tracker ──
  function renderTracker() {
    const entries = Object.entries(applied);
    document.getElementById('tracker-sub').textContent = `${entries.length} candidature${entries.length !== 1 ? 's' : ''}`;

    const toRelance = entries.filter(([, e]) => {
      const days = Math.floor((Date.now() - e.date) / 86400000);
      return e.status === 'postule' && days >= 7;
    });

    document.getElementById('relance-alerts').innerHTML = toRelance
      .map(([, e]) => `<div class="relance-alert">⏰ Relancer <strong>${e.offer.company}</strong> — plus de 7 jours sans réponse</div>`)
      .join('');

    if (entries.length === 0) {
      document.getElementById('tracker-content').innerHTML = '<div class="empty-state">Aucune candidature pour l\'instant.<br>Postule à une offre pour la voir apparaître ici.</div>';
      return;
    }

    const STATUSES = ['postule', 'relance', 'entretien', 'refus'];
    const LABELS = { postule: 'Postulé', relance: 'Relancé', entretien: 'Entretien', refus: 'Refus' };

    document.getElementById('tracker-content').innerHTML = `
      <div class="table-wrap">
        <table class="tracker-table">
          <thead><tr>
            <th>Entreprise</th><th>Poste</th><th>Source</th>
            <th>Date candidature</th><th>Relance prévue</th><th>Statut</th><th>Lien</th>
          </tr></thead>
          <tbody>
            ${entries.map(([id, e]) => `<tr>
              <td style="font-weight:500">${e.offer.company}</td>
              <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.offer.title}</td>
              <td>${e.offer.source}</td>
              <td>${e.date.toLocaleDateString('fr-FR')}</td>
              <td>${e.relanceDate.toLocaleDateString('fr-FR')}</td>
              <td>
                <select onchange="changeStatus('${id}', this.value)">
                  ${STATUSES.map(s => `<option value="${s}"${e.status === s ? ' selected' : ''}>${LABELS[s]}</option>`).join('')}
                </select>
              </td>
              <td><a href="${e.offer.url}" target="_blank" style="color:var(--blue);text-decoration:none;font-size:12px;">Voir ↗</a></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  }

  function changeStatus(id, status) {
    if (applied[id]) { applied[id].status = status; updateStats(); renderTracker(); }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ── Init ──
  fetchOffers();
</script>
